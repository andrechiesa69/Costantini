<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#000000">
  <title>Costantini – Realtà Aumentata</title>

  <!-- Supporto import map per iOS < 16.4 e browser più vecchi -->
  <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
    }
  }
  </script>

  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background: #000; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
      touch-action: manipulation; overscroll-behavior: none;
    }
    #ar-container { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; overflow: hidden; }
    /* il video e il canvas creati da MindAR */
    #ar-container video, #ar-container canvas { position: absolute; }

    /* ---------- MIRINO DI SCANSIONE (angoli bianchi) ---------- */
    #scanner {
      position: fixed; inset: 0; z-index: 10; pointer-events: none;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: opacity .35s ease;
    }
    #scanner.hidden { opacity: 0; }
    .frame {
      position: relative;
      height: min(62vh, 150vw); aspect-ratio: 1007 / 1942; /* pagina verticale */
    }
    .corner { position: absolute; width: 44px; height: 44px; border: 0 solid #fff; filter: drop-shadow(0 0 4px rgba(0,0,0,.6)); }
    .tl { top: 0; left: 0;  border-top-width: 5px; border-left-width: 5px;  border-top-left-radius: 14px; }
    .tr { top: 0; right: 0; border-top-width: 5px; border-right-width: 5px; border-top-right-radius: 14px; }
    .bl { bottom: 0; left: 0;  border-bottom-width: 5px; border-left-width: 5px;  border-bottom-left-radius: 14px; }
    .br { bottom: 0; right: 0; border-bottom-width: 5px; border-right-width: 5px; border-bottom-right-radius: 14px; }
    .frame { animation: breathe 2.2s ease-in-out infinite; }
    @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.04); } }
    .scanline {
      position: absolute; left: 6%; right: 6%; height: 2px; top: 10%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.9), transparent);
      animation: scan 2.4s ease-in-out infinite;
    }
    @keyframes scan { 0% { top: 8%; opacity: .2; } 50% { opacity: 1; } 100% { top: 92%; opacity: .2; } }
    .hint {
      margin-top: 22px; padding: 10px 18px; border-radius: 22px;
      background: rgba(0,0,0,.55); font-size: 15px; letter-spacing: .3px; text-align: center;
      -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    }

    /* ---------- CARICAMENTO ---------- */
    /* durante l'avvio si vede già il mirino: solo una piccola scritta in basso */
    #loading {
      position: fixed; left: 50%; bottom: calc(28px + env(safe-area-inset-bottom)); transform: translateX(-50%);
      z-index: 20; pointer-events: none; transition: opacity .4s ease;
      padding: 8px 16px; border-radius: 18px; background: rgba(0,0,0,.55); max-width: 86vw; text-align: center;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    .spinner { width: 34px; height: 34px; border-radius: 50%; border: 3px solid rgba(255,255,255,.25); border-top-color: #fff; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading p { margin: 0; font-size: 14px; opacity: .8; }

    /* ---------- MESSAGGI / ERRORI ---------- */
    #message {
      position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%);
      z-index: 30; max-width: 86vw; padding: 12px 18px; border-radius: 14px;
      background: rgba(0,0,0,.8); font-size: 14px; line-height: 1.4; text-align: center; display: none;
    }
    #error {
      position: fixed; inset: 0; z-index: 40; background: #000; display: none;
      flex-direction: column; align-items: center; justify-content: center; padding: 28px; text-align: center; gap: 14px;
    }
    #error h2 { margin: 0; font-weight: 600; font-size: 20px; }
    #error p { margin: 0; opacity: .85; line-height: 1.5; font-size: 15px; }

    /* ---------- VISUALIZZATORE SITO + BOTTONE ROSSO ---------- */
    #viewer {
      position: fixed; inset: 0; z-index: 50; background: #fff; display: none;
      flex-direction: column;
    }
    #viewer.open { display: flex; }
    #viewer-frame { flex: 1; width: 100%; border: 0; background: #fff; }
    #viewer-spinner {
      position: absolute; top: 40%; left: 50%; width: 34px; height: 34px; margin: -17px 0 0 -17px;
      border-radius: 50%; border: 3px solid rgba(0,0,0,.15); border-top-color: #b3001b; animation: spin 1s linear infinite;
    }
    #viewer-bar {
      flex: none; background: #fff; border-top: 1px solid #e3e3e3;
      padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
      display: flex; flex-direction: column; align-items: stretch; gap: 8px;
    }
    #back-ar {
      display: block; width: 100%; padding: 16px 12px; border: 0; border-radius: 6px;
      background: #c8102e; color: #fff; font-size: 17px; font-weight: 700; letter-spacing: .3px;
      text-align: center; cursor: pointer; box-shadow: 0 4px 14px rgba(200,16,46,.35);
      -webkit-appearance: none; appearance: none;
    }
    #back-ar:active { background: #9e0c24; }
    #viewer-ext { text-align: center; font-size: 13px; color: #555; text-decoration: underline; }
    #error button, #error a {
      margin-top: 8px; padding: 12px 22px; border-radius: 24px; border: 0;
      background: #fff; color: #000; font-size: 15px; font-weight: 600; text-decoration: none;
    }
  </style>
</head>
<body>
  <div id="ar-container"></div>

  <div id="scanner">
    <div class="frame">
      <div class="corner tl"></div><div class="corner tr"></div>
      <div class="corner bl"></div><div class="corner br"></div>
      <div class="scanline"></div>
    </div>
    <div class="hint">Inquadra la pagina</div>
  </div>

  <div id="loading">
    <p id="loading-text">Caricamento…</p>
  </div>

  <div id="viewer" aria-hidden="true">
    <div id="viewer-spinner"></div>
    <iframe id="viewer-frame" title="Costantini" referrerpolicy="no-referrer-when-downgrade" allow="fullscreen; autoplay"></iframe>
    <div id="viewer-bar">
      <button id="back-ar" type="button">Torna alla realtà aumentata</button>
      <a id="viewer-ext" href="#" target="_blank" rel="noopener">La pagina non si vede? Aprila nel browser</a>
    </div>
  </div>

  <div id="message"></div>

  <div id="error">
    <h2 id="error-title">Fotocamera non disponibile</h2>
    <p id="error-text"></p>
    <button id="retry" type="button">Riprova</button>
  </div>

  <script>
    // se le librerie AR non arrivano (rete lenta / blocchi), lo diciamo invece di restare fermi
    setTimeout(function () {
      if (window.__arBooted) return;
      var t = document.getElementById('loading-text');
      if (t) t.textContent = 'Non riesco a scaricare le librerie AR. Controlla la connessione e ricarica la pagina.';
    }, 20000);
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { MindARThree } from 'mindar-image-three';
    window.__arBooted = true;

    /* =========================================================
       CONFIGURAZIONE
       targets.mind contiene 1 target: la pagina Costantini intera (1007x1942).
       Coordinate: la pagina è larga 1 e alta 1.928, centro = (0,0),
       x verso destra, y verso l'alto (bordo alto = +0.964), z verso chi guarda.
       Posizioni misurate sulla pagina contenuta in targets.mind.
       ========================================================= */
    const LINKS = {
      sito:           'https://www.costantini1962.it/',
      certificazioni: 'https://www.costantini1962.it/aziende/index.html?page=home&sec=certificazioni.html',
      facebook:       'https://www.facebook.com/costantini1962/?locale=it_IT',
      instagram:      'https://www.instagram.com/costantini.srl/',
      linkedin:       'https://it.linkedin.com/company/costantini-1962',
      youtube:        'https://www.youtube.com/channel/UCVKL90KjeovtFLEucO8U_ug',
      dove:           'https://www.costantini1962.it/aziende/index.html?page=dove.html'
    };

    // icone social: in fondo, vicine tra loro, appena sopra quelle stampate (stampate a y≈-0.887)
    const SOC_Y = -0.80, SOC_H = 0.085, SOC_GAP = 0.115, SOC_X0 = 0.016;
    const TARGETS = [
      { // 0 - pagina intera
        items: [
          // logo COSTANTINI esattamente sopra la scritta stampata (posizione misurata), senza sfondo
          { img: 'logocostantini.png', link: LINKS.sito, w: 0.562 * 1.06, x: -0.164, y: 0.685, z: 0.012, from: { z: 0, s: 0.5 } },

          // certificazioni in alto, ognuna esattamente sopra il proprio logo stampato, senza sfondo (link unico)
          { img: 'icim9001.png',  link: LINKS.certificazioni, w: 0.105 * 1.12, x: 0.037, y: 0.880, z: 0.012, from: { z: 0, s: 0.4 } },
          { img: 'icim14001.png', link: LINKS.certificazioni, w: 0.113 * 1.12, x: 0.225, y: 0.896, z: 0.012, from: { z: 0, s: 0.4 } },
          { img: 'apave.png',     link: LINKS.certificazioni, w: 0.148 * 1.12, x: 0.402, y: 0.892, z: 0.012, from: { z: 0, s: 0.4 } },
          // area di tocco unica che copre i tre loghi
          { hitArea: true, link: LINKS.certificazioni, w: 0.56, h: 0.17, x: 0.225, y: 0.888, z: 0.012 },

          // metà pagina: "dove siamo" a destra (sopra l'edificio) e, alla stessa altezza a sinistra,
          // la grafica animata "CLICCA SUI LOGHI" (sopra la scritta PIACENZAEXPO)
          { img: 'dovesiamo.png', link: LINKS.dove, w: 0.40, x: 0.255, y: 0.07, z: 0.03, from: { z: 0, s: 0.4 } },
          { anim: 'CLICCA SUI LOGHI', w: 0.52, x: -0.215, y: 0.07, z: 0.03, from: { s: 0.6 } },

          // social, senza sfondo
          { img: 'fb.png', link: LINKS.facebook,  h: SOC_H, x: SOC_X0 - 1.5 * SOC_GAP, y: SOC_Y, z: 0.04, from: { x: -0.080, y: -0.887, z: 0, s: 0.3 } },
          { img: 'ig.png', link: LINKS.instagram, h: SOC_H, x: SOC_X0 - 0.5 * SOC_GAP, y: SOC_Y, z: 0.04, from: { x: -0.018, y: -0.887, z: 0, s: 0.3 } },
          { img: 'in.png', link: LINKS.linkedin,  h: SOC_H, x: SOC_X0 + 0.5 * SOC_GAP, y: SOC_Y, z: 0.04, from: { x:  0.045, y: -0.887, z: 0, s: 0.3 } },
          { img: 'yt.png', link: LINKS.youtube,   h: SOC_H * 0.85, x: SOC_X0 + 1.5 * SOC_GAP, y: SOC_Y, z: 0.04, from: { x: 0.111, y: -0.887, z: 0, s: 0.3 } }
        ],
        labels: []
      }
    ];

    /* ---------- elementi UI ---------- */
    const $ = (id) => document.getElementById(id);
    const scannerEl = $('scanner'), loadingEl = $('loading'), messageEl = $('message');

    function showMessage(text, ms = 4000) {
      messageEl.textContent = text; messageEl.style.display = 'block';
      clearTimeout(showMessage._t);
      if (ms) showMessage._t = setTimeout(() => (messageEl.style.display = 'none'), ms);
    }
    function showError(title, text, canRetry = true) {
      $('error-title').textContent = title; $('error-text').innerHTML = text;
      $('retry').style.display = canRetry ? 'inline-block' : 'none';
      $('error').style.display = 'flex'; loadingEl.classList.add('hidden');
    }
    $('retry').addEventListener('click', () => location.reload());

    /* ---------- controlli preliminari (iOS / Android) ---------- */
    const ua = navigator.userAgent || '';
    const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const inAppBrowser = /FBAN|FBAV|FB_IAB|Instagram|Line\/|MicroMessenger|TikTok|Snapchat/i.test(ua);

    function preflight() {
      if (!window.isSecureContext) {
        showError('Serve una connessione sicura', 'Apri la pagina con <b>https://</b> (GitHub Pages lo fa già).', false);
        return false;
      }
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        const where = isIOS ? 'Safari' : 'Chrome';
        showError('Browser non supportato',
          inAppBrowser
            ? `Stai usando il browser interno di un'app. Tocca <b>⋯</b> e scegli <b>Apri in ${where}</b>.`
            : `Apri questa pagina con <b>${where}</b> aggiornato.`, false);
        return false;
      }
      return true;
    }

    /* ---------- texture helper ---------- */
    const loader = new THREE.TextureLoader();
    // Carica l'immagine e la riduce a max 1024 px: su iPhone le immagini troppo grandi
    // non vengono disegnate in 3D (limite di memoria di WebKit), senza dare errori.
    const MAX_TEX = 1024;
    function loadOne(url) {
      return new Promise((res, rej) => {
        const img = new Image();
        img.decoding = 'async';
        img.onload = () => {
          try {
            const k = Math.min(1, MAX_TEX / Math.max(img.naturalWidth, img.naturalHeight));
            const w = Math.max(1, Math.round(img.naturalWidth * k));
            const h = Math.max(1, Math.round(img.naturalHeight * k));
            const c = document.createElement('canvas');
            c.width = w; c.height = h;
            c.getContext('2d').drawImage(img, 0, 0, w, h);
            const t = new THREE.CanvasTexture(c);
            t.colorSpace = THREE.SRGBColorSpace;
            t.generateMipmaps = false;
            t.minFilter = THREE.LinearFilter;
            res(t);
          } catch (e) { rej(e); }
        };
        img.onerror = rej;
        img.src = url + (url.includes('?') ? '&' : '?') + 'v=' + Date.now(); // evita versioni vecchie in cache
      });
    }
    // prova il file accanto a index.html, poi dentro la cartella assets/
    async function loadTexture(names) {
      const list = (Array.isArray(names) ? names : [names]).flatMap((n) => [n, 'assets/' + n]);
      for (const url of list) { try { return await loadOne(url); } catch (e) {} }
      throw new Error('non trovato: ' + list[0]);
    }
    function labelTexture(text) {
      const c = document.createElement('canvas');
      c.width = 1024; c.height = 160;
      const g = c.getContext('2d');
      const r = 80;
      g.fillStyle = 'rgba(0,0,0,0.62)';
      g.beginPath();
      g.moveTo(r, 0); g.lineTo(c.width - r, 0); g.arc(c.width - r, r, r, -Math.PI / 2, Math.PI / 2);
      g.lineTo(r, c.height); g.arc(r, r, r, Math.PI / 2, Math.PI * 1.5); g.fill();
      g.strokeStyle = 'rgba(255,255,255,0.85)'; g.lineWidth = 5; g.stroke();
      g.fillStyle = '#fff';
      g.font = 'italic 600 64px Georgia, "Times New Roman", serif';
      g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText(text, c.width / 2, c.height / 2 + 4);
      const t = new THREE.CanvasTexture(c);
      t.colorSpace = THREE.SRGBColorSpace;
      return { tex: t, aspect: c.height / c.width };
    }
    function glowTexture() {
      const c = document.createElement('canvas'); c.width = c.height = 256;
      const g = c.getContext('2d');
      const grd = g.createRadialGradient(128, 128, 10, 128, 128, 128);
      grd.addColorStop(0, 'rgba(0,0,0,0.75)'); grd.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = grd; g.fillRect(0, 0, 256, 256);
      return new THREE.CanvasTexture(c);
    }

    /* ---------- GRAFICA ANIMATA "CLICCA SUI LOGHI" (disegnata, ciclo di 4 s) ----------
       bottone giallo che si apre -> scritta lettera per lettera -> manina che arriva e preme -> raggi del clic */
    function makeClickHint(text) {
      const c = document.createElement('canvas'); c.width = 1024; c.height = 400;
      const g = c.getContext('2d');
      const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
      const ease = (t) => 1 - Math.pow(1 - Math.min(1, Math.max(0, t)), 3);
      const BW = 780, BH = 150, BX = 40, BY = 60;          // bottone
      function roundRect(x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
      function hand(x, y, s) {                              // manina che indica (punta del dito in x,y)
        g.save(); g.translate(x, y); g.scale(s, s); g.rotate(-0.35);
        g.lineJoin = 'round'; g.lineWidth = 7; g.strokeStyle = '#111'; g.fillStyle = '#fff';
        g.beginPath();
        g.moveTo(-14, 0); g.arcTo(-14, -16, 0, -16, 14); g.arcTo(14, -16, 14, 0, 14);     // punta indice
        g.lineTo(14, 70);
        g.arcTo(14, 56, 30, 56, 14); g.arcTo(44, 56, 44, 72, 14); g.lineTo(44, 80);        // medio
        g.arcTo(44, 66, 58, 66, 13); g.arcTo(72, 66, 72, 80, 13); g.lineTo(72, 88);        // anulare
        g.arcTo(72, 76, 85, 76, 12); g.arcTo(98, 76, 98, 90, 12); g.lineTo(98, 140);       // mignolo
        g.quadraticCurveTo(98, 190, 50, 196); g.lineTo(20, 196);
        g.quadraticCurveTo(-10, 194, -30, 160); g.lineTo(-58, 112);                         // polso / pollice
        g.arcTo(-70, 90, -48, 86, 14); g.lineTo(-14, 118);
        g.closePath(); g.fill(); g.stroke();
        g.lineWidth = 5; g.beginPath(); g.moveTo(44, 80); g.lineTo(44, 104); g.moveTo(72, 88); g.lineTo(72, 108); g.stroke();
        g.restore();
      }
      function draw(time) {
        const t = time % 4.0;
        g.clearRect(0, 0, c.width, c.height);
        const open = ease(t / 0.45);                                  // apertura bottone
        const fade = t > 3.7 ? 1 - (t - 3.7) / 0.3 : 1;               // dissolvenza finale
        const press = (t > 1.85 && t < 2.25) ? Math.sin((t - 1.85) / 0.4 * Math.PI) : 0;
        const sc = 1 - press * 0.06;
        g.globalAlpha = fade;
        // bottone (ombra + giallo)
        const w = Math.max(12, BW * open), x = BX + (BW - w) / 2;
        g.save(); g.translate(BX + BW / 2, BY + BH / 2); g.scale(sc, sc); g.translate(-(BX + BW / 2), -(BY + BH / 2));
        g.fillStyle = '#d9a514'; roundRect(x, BY + 12, w, BH, 22); g.fill();
        g.fillStyle = '#ffcd2e'; roundRect(x, BY + (press * 8), w, BH, 22); g.fill();
        // scritta che compare lettera per lettera
        const n = Math.floor(ease((t - 0.45) / 0.8) * text.length);
        if (n > 0) {
          g.fillStyle = '#1a1a1a'; g.font = 'bold 74px "Arial Black", Arial, Helvetica, sans-serif';
          g.textBaseline = 'middle'; g.textAlign = 'left';
          const full = g.measureText(text).width, k = Math.min(1, (BW - 80) / full);
          g.save(); g.translate(BX + (BW - full * k) / 2, BY + BH / 2 + 4 + press * 8); g.scale(k, 1);
          g.fillText(text.slice(0, n), 0, 0); g.restore();
        }
        g.restore();
        // manina: arriva da in basso a destra e preme sul bordo destro del bottone
        if (t > 1.2) {
          const a = ease((t - 1.2) / 0.6);
          const tx = BX + BW - 70, ty = BY + BH - 30 + press * 12;
          const hx = tx + (1 - a) * 260, hy = ty + (1 - a) * 220 + Math.sin(Math.max(0, t - 2.3) * 5) * 4 * (t > 2.3 ? 1 : 0);
          // raggi del clic
          if (t > 1.95 && t < 2.6) {
            const r = ease((t - 1.95) / 0.45), al = 1 - (t - 1.95) / 0.65;
            g.save(); g.globalAlpha = fade * Math.max(0, al); g.strokeStyle = '#1a1a1a'; g.lineWidth = 10; g.lineCap = 'round';
            for (let i = 0; i < 5; i++) {
              const ang = -Math.PI / 2 - 0.9 + i * 0.5;
              g.beginPath(); g.moveTo(tx + Math.cos(ang) * (30 + r * 20), ty + Math.sin(ang) * (30 + r * 20));
              g.lineTo(tx + Math.cos(ang) * (55 + r * 40), ty + Math.sin(ang) * (55 + r * 40)); g.stroke();
            }
            g.restore();
          }
          hand(hx, hy, 0.95);
        }
        g.globalAlpha = 1;
        tex.needsUpdate = true;
      }
      draw(0);
      return { texture: tex, aspect: c.height / c.width, draw };
    }

    /* ---------- AR ---------- */
    let mindarThree = null;
    let started = false;
    const clickables = [];   // mesh cliccabili
    const anchorsState = []; // stato animazioni per target
    let visibleCount = 0;
    const missingFiles = [];

    const easeOutBack = (t) => { const c1 = 1.4, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };

    async function buildScene() {
      mindarThree = new MindARThree({
        container: $('ar-container'),
        imageTargetSrc: './targets.mind',
        maxTrack: 1,
        uiLoading: 'no',
        uiScanning: 'no',
        uiError: 'no',
        filterMinCF: 0.0001,
        filterBeta: 0.001,
        warmupTolerance: 1,
        missTolerance: 10
      });
      const { renderer, scene } = mindarThree;
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5)); // meno carico sul telefono = aggancio più rapido

      for (let i = 0; i < TARGETS.length; i++) {
        const cfg = TARGETS[i];
        const anchor = mindarThree.addAnchor(i);
        const state = { anchor, t: 0, visible: false, objects: [] };

        const content = new THREE.Group();
        anchor.group.add(content);
        state.content = content;
        for (const it of [...cfg.items, ...(cfg.pageItems || [])]) {
          if (it.anim) {                          // grafica animata disegnata (non cliccabile)
            const ah = makeClickHint(it.anim);
            const ag = new THREE.Group();
            ag.add(new THREE.Mesh(new THREE.PlaneGeometry(it.w, it.w * ah.aspect),
              new THREE.MeshBasicMaterial({ map: ah.texture, transparent: true, depthWrite: false })));
            content.add(ag);
            state.objects.push({ group: ag, cfg: it, phase: 0, pressed: 0, noFloat: true, animDraw: ah.draw, animStart: 0 });
            continue;
          }
          if (it.hitArea) {                       // area di tocco invisibile (es. le 3 certificazioni insieme)
            const hitG = new THREE.Group();
            const hp = new THREE.Mesh(new THREE.PlaneGeometry(it.w, it.h), new THREE.MeshBasicMaterial({ visible: false }));
            hp.userData.link = it.link; hp.userData.group = hitG;
            hitG.add(hp); clickables.push(hp); content.add(hitG);
            state.objects.push({ group: hitG, cfg: { ...it, from: { s: 1 } }, phase: 0, pressed: 0, noFloat: true });
            continue;
          }
          let tex;
          try { tex = await loadTexture(it.img); }
          catch (e) { missingFiles.push([].concat(it.img)[0]); continue; } // immagine mancante: si salta, la pagina parte lo stesso
          const aspect = tex.image.height / tex.image.width;     // tex.image = canvas ridotto
          if (it.h && !it.w) it.w = it.h / aspect;                  // dimensione data in altezza
          const h = it.w * aspect;
          const group = new THREE.Group();

          if (it.panel) {                       // piastrina bianca arrotondata dietro al logo (copre la stampa sotto)
            const pw = it.w + h * 0.35, ph = h * 1.3;
            const pc = document.createElement('canvas'); pc.width = 512; pc.height = Math.max(64, Math.round(512 * ph / pw));
            const pg = pc.getContext('2d'), rr = Math.min(pc.height, pc.width) * 0.22, m = 10;
            pg.shadowColor = 'rgba(0,0,0,0.35)'; pg.shadowBlur = 10;
            pg.fillStyle = 'rgba(255,255,255,0.96)';
            pg.beginPath(); pg.roundRect ? pg.roundRect(m, m, pc.width - 2 * m, pc.height - 2 * m, rr) : pg.rect(m, m, pc.width - 2 * m, pc.height - 2 * m); pg.fill();
            const pt = new THREE.CanvasTexture(pc); pt.colorSpace = THREE.SRGBColorSpace;
            const panel = new THREE.Mesh(new THREE.PlaneGeometry(pw, ph), new THREE.MeshBasicMaterial({ map: pt, transparent: true, depthWrite: false }));
            panel.position.z = -0.004;
            group.add(panel);
          }
          if (it.glow) {
            const glow = new THREE.Mesh(
              new THREE.PlaneGeometry(it.w * 1.25, h * 2.2),
              new THREE.MeshBasicMaterial({ map: glowTexture(), transparent: true, depthWrite: false })
            );
            glow.position.z = -0.01;
            group.add(glow);
          }
          const mesh = new THREE.Mesh(
            new THREE.PlaneGeometry(it.w, h),
            new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false, side: THREE.DoubleSide })
          );
          mesh.userData.link = it.link;
          mesh.userData.group = group;
          group.add(mesh);

          // area di tocco più grande dell'immagine (più facile da colpire col dito)
          const hit = new THREE.Mesh(
            new THREE.PlaneGeometry(it.w * 1.25, h * 1.15),
            new THREE.MeshBasicMaterial({ visible: false })
          );
          hit.userData.link = it.link;
          hit.userData.group = group;
          group.add(hit);
          clickables.push(hit);

          content.add(group);
          state.objects.push({ group, cfg: it, phase: Math.random() * Math.PI * 2, pressed: 0 });
        }

        for (const lb of cfg.labels || []) {
          const { tex, aspect } = labelTexture(lb.text);
          const m = new THREE.Mesh(
            new THREE.PlaneGeometry(lb.w, lb.w * aspect),
            new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false })
          );
          const group = new THREE.Group();
          group.add(m);
          content.add(group);
          state.objects.push({ group, cfg: { x: lb.x, y: lb.y, z: 0.04, from: { s: 0.001 }, label: true }, phase: 0, pressed: 0 });
        }

        anchor.onTargetFound = () => {
          state.visible = true; state.t = 0;
          visibleCount++;
          scannerEl.classList.add('hidden');
          if (navigator.vibrate) { try { navigator.vibrate(30); } catch (e) {} }
        };
        anchor.onTargetLost = () => {
          state.visible = false;
          visibleCount = Math.max(0, visibleCount - 1);
          if (visibleCount === 0) scannerEl.classList.remove('hidden');
        };
        anchorsState.push(state);
      }

      // espone lo stato per eventuali test/debug
      window.__costantiniAR = { mindarThree, clickables, anchorsState, THREE };
    }

    /* ---------- animazione ---------- */
    const clock = new THREE.Clock();
    function animate() {
      const dt = Math.min(clock.getDelta(), 0.1);
      const time = clock.elapsedTime;
      const pageOn = anchorsState[0] && anchorsState[0].visible;
      anchorsState.forEach((st, i) => { if (i > 0 && st.content) st.content.visible = !pageOn; });
      for (const st of anchorsState) {
        if (st.visible) st.t = Math.min(1, st.t + dt / 0.7);
        const k = easeOutBack(st.t);
        for (const o of st.objects) {
          if (o.animDraw && st.visible) { if (st.t < 0.05) o.animStart = time; o.animDraw(time - o.animStart); }
          const c = o.cfg, f = c.from || {};
          const fx = f.x ?? c.x, fy = f.y ?? c.y, fz = f.z ?? c.z, fs = f.s ?? 1;
          const float = (c.label || o.noFloat || c.z < 0.02) ? 0 : Math.sin(time * 1.6 + o.phase) * 0.008;
          o.group.position.set(fx + (c.x - fx) * k, fy + (c.y - fy) * k + float * st.t, fz + (c.z - fz) * k);
          o.pressed = Math.max(0, o.pressed - dt * 4);
          const s = (fs + (1 - fs) * k) * (1 + 0.12 * Math.sin(o.pressed * Math.PI));
          o.group.scale.setScalar(Math.max(0.001, s));
        }
      }
      mindarThree.renderer.render(mindarThree.scene, mindarThree.camera);
    }

    /* ---------- tocco / click ---------- */
    const raycaster = new THREE.Raycaster();
    const ndc = new THREE.Vector2();

    // Il sito Costantini si apre DENTRO la pagina, con il bottone rosso per tornare all'AR.
    // Facebook, Instagram, LinkedIn e YouTube non permettono di essere mostrati dentro altre pagine:
    // si aprono nell'app/nuova scheda (su iPhone si torna con "◀" in alto a sinistra).
    const EMBED_HOSTS = ['costantini1962.it'];
    const viewer = $('viewer'), frame = $('viewer-frame'), spinner = $('viewer-spinner');
    let viewerOpen = false;
    frame.addEventListener('load', () => { spinner.style.display = 'none'; });

    function openViewer(url) {
      viewerOpen = true;
      spinner.style.display = 'block';
      $('viewer-ext').href = url;
      frame.src = url;
      viewer.classList.add('open');
      viewer.setAttribute('aria-hidden', 'false');
      scannerEl.classList.add('hidden');
      try { history.pushState({ viewer: true }, ''); } catch (e) {}
    }
    function closeViewer(fromHistory) {
      if (!viewerOpen) return;
      viewerOpen = false;
      viewer.classList.remove('open');
      viewer.setAttribute('aria-hidden', 'true');
      frame.src = 'about:blank';
      if (visibleCount === 0) scannerEl.classList.remove('hidden');
      if (!fromHistory) { try { if (history.state && history.state.viewer) history.back(); } catch (e) {} }
      setTimeout(resumeCamera, 200);
    }
    $('back-ar').addEventListener('click', () => closeViewer(false));
    // anche il tasto/gesto "indietro" del telefono riporta all'AR
    window.addEventListener('popstate', () => closeViewer(true));

    function openLink(url) {
      let host = '';
      try { host = new URL(url).hostname; } catch (e) {}
      if (EMBED_HOSTS.some((h) => host === h || host.endsWith('.' + h))) { openViewer(url); return; }
      // apertura immediata nello stesso gesto (necessario per iOS)
      const w = window.open(url, '_blank');
      if (w) { try { w.opener = null; } catch (e) {} }
      else window.location.href = url; // se il popup viene bloccato
    }

    function pick(clientX, clientY) {
      const canvas = mindarThree.renderer.domElement;
      const rect = canvas.getBoundingClientRect();
      ndc.x = ((clientX - rect.left) / rect.width) * 2 - 1;
      ndc.y = -((clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(ndc, mindarThree.camera);
      const visibles = clickables.filter((m) => {
        let p = m; while (p) { if (!p.visible) return false; p = p.parent; }
        return true;
      });
      const hits = raycaster.intersectObjects(visibles, false);
      return hits.length ? hits[0].object : null;
    }

    function onTap(e) {
      if (!started || viewerOpen) return;
      const hit = pick(e.clientX, e.clientY);
      if (!hit) return;
      e.preventDefault();
      for (const st of anchorsState) for (const o of st.objects) if (o.group === hit.userData.group || (o.cfg.link === hit.userData.link && !o.cfg.hitArea)) o.pressed = 1;
      openLink(hit.userData.link);
    }

    /* ---------- avvio / ripresa ---------- */
    async function start() {
      if (!preflight()) return;
      let step = 'file';
      const setText = (t) => { $('loading-text').textContent = t; };
      setText('Caricamento file…');
      const watchdog = setTimeout(() => {
        if (!started) setText(step === 'fotocamera'
          ? 'La fotocamera non risponde: se vedi una richiesta di accesso, tocca Consenti. Altrimenti chiudi la scheda e riapri il link.'
          : 'Caricamento lento (' + step + ')… controlla la connessione.');
      }, 15000);
      try {
        // 1) il file dei target esiste?
        const r = await fetch('./targets.mind', { cache: 'no-cache' });
        if (!r.ok) throw Object.assign(new Error('targets.mind non trovato (HTTP ' + r.status + ')'), { name: 'FileMancante' });

        // 2) scena 3D e immagini
        step = 'scena';
        setText('Preparazione della scena…');
        await buildScene();

        // 3) fotocamera + riconoscimento
        step = 'fotocamera';
        setText('Avvio della fotocamera…');
        await mindarThree.start();

        started = true;
        clearTimeout(watchdog);
        mindarThree.renderer.setAnimationLoop(animate);
        loadingEl.classList.add('hidden');
        $('ar-container').addEventListener('click', onTap, { passive: false });
        if (missingFiles.length) showMessage('Immagini non trovate: ' + missingFiles.join(', '), 0);
        else if (inAppBrowser) showMessage(`Per un'esperienza migliore apri la pagina in ${isIOS ? 'Safari' : 'Chrome'}.`, 6000);
      } catch (err) {
        clearTimeout(watchdog);
        console.error(err);
        // MindAR non riporta il motivo dell'errore fotocamera: lo chiediamo direttamente al browser
        if (step === 'fotocamera' && !(err && err.name)) {
          try {
            const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
            s.getTracks().forEach((t) => t.stop());
          } catch (e2) { err = e2; }
        }
        const name = (err && err.name) || '';
        const detail = `<br><small style="opacity:.6">Dettaglio tecnico: ${step} · ${name} ${(err && err.message) || (err ? String(err) : 'sconosciuto')}</small>`;
        const permHelp = isIOS
          ? 'Su iPhone: <b>Impostazioni › Safari › Fotocamera › Consenti</b> (se usi Chrome: <b>Impostazioni › Chrome › Fotocamera</b>), poi ricarica.'
          : 'Tocca l\'icona del lucchetto accanto all\'indirizzo, consenti la <b>Fotocamera</b> e ricarica.';

        if (name === 'FileMancante') {
          showError('File mancante sul sito', 'Il file <b>targets.mind</b> non è nella stessa cartella di <b>index.html</b> su GitHub.' + detail);
        } else if (step === 'scena') {
          showError('Errore di caricamento', 'Non sono riuscito a preparare la scena AR. Controlla la connessione e riprova.' + detail);
        } else if (name === 'NotAllowedError' || name === 'SecurityError') {
          showError('Accesso alla fotocamera negato', permHelp + detail);
        } else if (name === 'NotReadableError' || name === 'AbortError') {
          showError('Fotocamera occupata', 'Un\'altra app o un\'altra scheda sta usando la fotocamera: chiudila e riprova.' + detail);
        } else {
          showError('Impossibile avviare la fotocamera', permHelp + detail);
        }
      }
    }

    // Quando si torna dal sito/app (Facebook, Instagram…) la fotocamera può essere sospesa: la riattiviamo.
    let restarting = false;
    async function resumeCamera() {
      if (!started || restarting) return;
      const video = $('ar-container').querySelector('video');
      const track = video && video.srcObject && video.srcObject.getVideoTracks()[0];
      const dead = !video || !track || track.readyState === 'ended' || track.muted;
      if (!dead) { try { await video.play(); } catch (e) {} if (!video.paused) return; }
      restarting = true;
      try {
        mindarThree.renderer.setAnimationLoop(null);
        mindarThree.stop();
        await mindarThree.start();
        mindarThree.renderer.setAnimationLoop(animate);
        visibleCount = 0;
        anchorsState.forEach((s) => { s.visible = false; s.t = 0; });
        scannerEl.classList.remove('hidden');
      } catch (e) {
        showError('Fotocamera interrotta', 'Ricarica la pagina per riprendere.');
      } finally { restarting = false; }
    }
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') setTimeout(resumeCamera, 300); });
    window.addEventListener('pageshow', (e) => { if (e.persisted) setTimeout(resumeCamera, 300); });

    start();
  </script>
</body>
</html>
